<!doctype html>
<html lang="en" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <title>VF Wallet: Passkey ceremony</title>
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./vibing_farmer.logo.svg" />
    <link rel="stylesheet" href="./approval.css" />
    <style>
      /* ceremony.html opens as a full browser tab (background.js's tabs.create), not a fixed
         popup window -- approval.css already centers the wallet shell horizontally; add vertical
         centering too since a tab (unlike the approve.html popup window) is tall. */
      body {
        min-height: 100vh;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="pc-wallet pc-wallet-shell" data-pocket-critical>
      <header class="pc-wallet-header">
        <div class="pc-brand-lockup pc-brand-lockup--compact">
          <img src="./vibing_farmer.logo.svg" alt="Vibing Farmer" />
          <span>VF Wallet</span>
        </div>
        <span class="pc-technical">passkey · secp256r1</span>
      </header>
      <main class="pc-wallet-main">
        <h1>Passkey ceremony</h1>
        <p id="status">Starting passkey ceremony</p>
        <p class="pc-field-help">
          Approve with Face ID when prompted. This tab closes automatically when done.
        </p>
      </main>
    </div>
    <script type="module" src="./ceremony.js"></script>
  </body>
</html>
