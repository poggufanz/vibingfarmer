<!doctype html>
<html lang="en" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <title>VF Wallet: Approval</title>
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./vibing_farmer.logo.svg" />
    <link rel="stylesheet" href="./approval.css" />
  </head>
  <body>
    <div class="pc-wallet pc-wallet-shell" data-pocket-critical>
      <header class="pc-wallet-header">
        <div class="pc-brand-lockup pc-brand-lockup--compact">
          <img src="./vibing_farmer.logo.svg" alt="Vibing Farmer" />
          <span>VF Wallet</span>
        </div>
      </header>
      <main class="pc-wallet-main">
        <div class="pc-wallet-origin">
          <span class="pc-technical" id="origin"></span>
        </div>
        <h1 id="title">Loading request</h1>
        <p id="note"></p>
        <table class="pc-approval-table">
          <tbody id="rows"></tbody>
        </table>
        <div id="raw-wrap" style="display: none">
          <details>
            <summary>Raw XDR</summary>
            <pre id="raw"></pre>
          </details>
        </div>
        <div class="pc-field" id="pw-wrap" style="display: none">
          <label for="pw">Password</label>
          <input class="pc-input" id="pw" type="password" placeholder="Wallet password" />
        </div>
        <p id="status"></p>
      </main>
      <div class="pc-wallet-approval-actions">
        <button class="pc-button pc-button--secondary" id="reject">Reject</button>
        <button class="pc-button pc-button--primary" id="approve">Approve</button>
      </div>
    </div>
    <script type="module" src="./approve.js"></script>
  </body>
</html>
