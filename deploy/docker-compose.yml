# deploy/docker-compose.yml — Oracle VM stack: relayer + lifeboat radar + cloudflared tunnel.
# No public ports: the relayer is reachable ONLY through the tunnel (the Cloudflare Pages proxy
# adds origin allowlist + rate limit + the shared key the relayer enforces on x-vf-relayer-key).
# The relayer image needs the repository-root deployment facts as immutable runtime authority.
services:
  relayer:
    build:
      context: ..
      dockerfile: relayer/Dockerfile
    restart: unless-stopped
    env_file: ${RELAYER_ENV_FILE:-.env}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    environment:
      RELAYER_DB_PATH: /data/relayer.db
    volumes:
      - relayer-data:/data
    # NOTE: no `ports:` — tunnel-only by design.

  radar:
    build:
      context: ../keeper
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${RELAYER_ENV_FILE:-.env}

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}

volumes:
  relayer-data:
